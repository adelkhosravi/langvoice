[project]
name = "langvoice"
version = "0.1.0"
description = "Turn Swedish sentences into synthetic learning clips for Hub, with any TTS engine"
readme = "README.md"
authors = [{ name = "Adel Khosravi", email = "adel.khosravi@gmail.com" }]
# 3.12 because langprep (whose sidecar and enrich we import) is pinned there,
# and chatterbox-tts pins torch 2.6, which has no wheels past 3.13.
requires-python = ">=3.12,<3.13"

# The base install has no torch: it writes sidecars and drives ffmpeg, which is
# all the cloud engines will need.
dependencies = [
    # Cloud engines speak HTTPS through this; langprep has it too, but we use it directly.
    "httpx>=0.28.1",
    "langprep",
    "numpy",
    "soundfile>=0.13",
    "typer>=0.19",
]

[project.optional-dependencies]
# Its own venv, not langprep's: chatterbox-tts pins torch==2.6 and numpy<2,
# and langprep is on torch 2.14 and numpy 2.5. Those cannot share one env.
#
# From git, pinned to a commit: the v3 multilingual checkpoint is opt-in on
# master (3f35dfc8fb, 2026-05-01) and PyPI's newest, 0.1.7, only loads v2.
chatterbox = ["chatterbox-tts @ git+https://github.com/resemble-ai/chatterbox@5de7a54aa4e5e2baadb0182dde554908b48b85c2"]

# Small CPU voices, one Swedish speaker each. Wrong melody, right sounds.
piper = ["piper-tts>=1.8"]

[project.scripts]
langvoice = "langvoice.cli:main"

[tool.uv.sources]
# Only the light base is used (sidecar, enrich). Editable, so a schema change
# in langprep reaches this tool without a reinstall.
langprep = { path = "../langprep", editable = true }

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
